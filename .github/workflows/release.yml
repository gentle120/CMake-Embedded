name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CMAKE_EMBEDDED_SKIP_FIRMWARE_BUILDS: "1"
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out "cmake-embedded-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "cmake-embedded-${GITHUB_REF_NAME#v}.vsix" \
            --generate-notes \
            --title "CMake-Embedded ${GITHUB_REF_NAME#v}"
